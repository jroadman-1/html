<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strobe Tuner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #e8dcc8;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  #top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: rgba(10,10,10,0.9);
    border-bottom: 1px solid #222;
    z-index: 10;
  }

  #device-select {
    background: #111;
    color: #888;
    border: 1px solid #333;
    padding: 4px 8px;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
    max-width: 200px;
  }

  #device-select:focus { outline: none; border-color: #555; }

  #signal-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #333;
    transition: background 0.1s;
  }

  #signal-indicator.active { background: #4a8; }

  #status-text {
    font-size: 11px;
    color: #444;
    letter-spacing: 0.05em;
  }

  #main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #note-display {
    font-size: 52px;
    font-weight: bold;
    letter-spacing: -0.02em;
    color: #f0e8d0;
    text-shadow: 0 0 20px rgba(240,232,208,0.3);
    min-width: 120px;
    text-align: center;
    line-height: 1;
  }

  #note-display.dim { color: #333; text-shadow: none; }

  #strobe-container {
    position: relative;
    width: 420px;
    height: 420px;
  }

  #strobe-canvas {
    border-radius: 50%;
    display: block;
  }

  #center-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }

  #cents-display {
    font-size: 36px;
    font-weight: bold;
    color: #f0e8d0;
    text-shadow: 0 0 12px rgba(240,232,208,0.4);
    letter-spacing: -0.02em;
    line-height: 1;
  }

  #cents-display.dim { color: #2a2a2a; text-shadow: none; }
  #cents-display.in-tune { color: #6be08a; text-shadow: 0 0 16px rgba(107,224,138,0.5); }

  #freq-display {
    font-size: 13px;
    color: #555;
    margin-top: 4px;
    letter-spacing: 0.05em;
  }

  #freq-display.active { color: #888; }

  #start-btn {
    background: #1a1a1a;
    color: #e8dcc8;
    border: 1px solid #444;
    padding: 12px 32px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 3px;
    text-transform: uppercase;
  }

  #start-btn:hover { background: #222; border-color: #666; }

  #tune-bar {
    width: 420px;
    height: 4px;
    background: #111;
    border-radius: 2px;
    position: relative;
    overflow: visible;
  }

  #tune-needle {
    position: absolute;
    top: -6px;
    width: 3px;
    height: 16px;
    background: #f0e8d0;
    border-radius: 1px;
    transform: translateX(-50%);
    left: 50%;
    transition: left 0.05s;
    box-shadow: 0 0 6px rgba(240,232,208,0.5);
  }

  #tune-needle.in-tune {
    background: #6be08a;
    box-shadow: 0 0 10px rgba(107,224,138,0.7);
  }

  #tune-bar-center {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 12px;
    background: #444;
    border-radius: 1px;
  }
</style>
</head>
<body>

<div id="top-bar">
  <div style="display:flex;align-items:center;gap:10px;">
    <div id="signal-indicator"></div>
    <select id="device-select"><option value="">— select input —</option></select>
  </div>
  <div id="status-text">CLICK START</div>
</div>

<div id="main">
  <div id="note-display" class="dim">—</div>

  <div id="strobe-container">
    <canvas id="strobe-canvas" width="420" height="420"></canvas>
    <div id="center-overlay">
      <div id="cents-display" class="dim">—</div>
      <div id="freq-display">— Hz</div>
    </div>
  </div>

  <div id="tune-bar">
    <div id="tune-bar-center"></div>
    <div id="tune-needle"></div>
  </div>

  <button id="start-btn">Start Tuner</button>
</div>

<script>
// ─── Constants ───────────────────────────────────────────────────────────────

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const A4 = 440.0;
const SAMPLE_RATE = 44100;
const BUFFER_SIZE = 4096; // ~93ms at 44100 — good for 82 Hz low E
const AMPLITUDE_GATE = 0.008;
const YIN_THRESHOLD = 0.15;
const CENTS_IN_TUNE = 0.8;
const SMOOTHING_ALPHA = 0.25; // EMA for cents

// Strobe ring definitions — [segment count, speed multiplier]
// Multipliers give each ring a distinct harmonic feel
const RINGS = [
  { segments: 18, speedMul: 1.0,  width: 32 },
  { segments: 24, speedMul: 2.0,  width: 28 },
  { segments: 30, speedMul: 3.0,  width: 24 },
  { segments: 36, speedMul: 4.0,  width: 20 },
  { segments: 48, speedMul: 6.0,  width: 16 },
];

// ─── State ───────────────────────────────────────────────────────────────────

let audioCtx = null;
let analyser = null;
let sourceNode = null;
let buffer = new Float32Array(BUFFER_SIZE);
let running = false;
let rafId = null;

let smoothedCents = 0;
let lastCents = null;
let lastNote = null;
let lastFreq = null;
let signalPresent = false;
let holdTimer = 0;

// Each ring has an accumulated rotation angle (radians)
let ringAngles = RINGS.map(() => 0);
let lastFrameTime = null;

// ─── DOM ─────────────────────────────────────────────────────────────────────

const canvas = document.getElementById('strobe-canvas');
const ctx2d = canvas.getContext('2d');
const noteEl = document.getElementById('note-display');
const centsEl = document.getElementById('cents-display');
const freqEl = document.getElementById('freq-display');
const startBtn = document.getElementById('start-btn');
const deviceSel = document.getElementById('device-select');
const sigIndicator = document.getElementById('signal-indicator');
const statusText = document.getElementById('status-text');
const tuneNeedle = document.getElementById('tune-needle');

// ─── YIN Algorithm ───────────────────────────────────────────────────────────

function yin(buffer, sampleRate) {
  const W = buffer.length;
  const half = Math.floor(W / 2);
  const d = new Float32Array(half);

  // Step 1 & 2: difference function
  for (let tau = 1; tau < half; tau++) {
    let s = 0;
    for (let j = 0; j < half; j++) {
      const diff = buffer[j] - buffer[j + tau];
      s += diff * diff;
    }
    d[tau] = s;
  }

  // Step 3: cumulative mean normalized difference
  const cmnd = new Float32Array(half);
  cmnd[0] = 1;
  let runSum = 0;
  for (let tau = 1; tau < half; tau++) {
    runSum += d[tau];
    cmnd[tau] = d[tau] * tau / runSum;
  }

  // Step 4: find first dip below threshold
  let tau = -1;
  for (let t = 2; t < half - 1; t++) {
    if (cmnd[t] < YIN_THRESHOLD) {
      while (t + 1 < half && cmnd[t + 1] < cmnd[t]) t++;
      tau = t;
      break;
    }
  }

  if (tau === -1) return { freq: -1, confidence: 0 };

  // Step 5: parabolic interpolation
  const x0 = tau > 1 ? tau - 1 : tau;
  const x2 = tau + 1 < half ? tau + 1 : tau;
  let betterTau;
  if (x0 === tau) {
    betterTau = cmnd[tau] <= cmnd[x2] ? tau : x2;
  } else if (x2 === tau) {
    betterTau = cmnd[tau] <= cmnd[x0] ? tau : x0;
  } else {
    const denom = 2 * cmnd[tau] - cmnd[x0] - cmnd[x2];
    betterTau = denom === 0 ? tau : tau + (cmnd[x2] - cmnd[x0]) / (2 * denom);
  }

  return {
    freq: sampleRate / betterTau,
    confidence: 1 - cmnd[tau],
  };
}

// ─── Pitch / Note Utilities ──────────────────────────────────────────────────

function freqToMidi(freq) {
  return 69 + 12 * Math.log2(freq / A4);
}

function midiToFreq(midi) {
  return A4 * Math.pow(2, (midi - 69) / 12);
}

function freqToNoteAndCents(freq) {
  const midi = freqToMidi(freq);
  const nearestMidi = Math.round(midi);
  const octave = Math.floor((nearestMidi - 12) / 12);
  const noteIdx = ((nearestMidi % 12) + 12) % 12;
  const noteName = NOTE_NAMES[noteIdx] + octave;
  const targetFreq = midiToFreq(nearestMidi);
  const cents = 1200 * Math.log2(freq / targetFreq);
  return { noteName, cents, targetFreq };
}

// ─── RMS amplitude ───────────────────────────────────────────────────────────

function rms(buf) {
  let s = 0;
  for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
  return Math.sqrt(s / buf.length);
}

// ─── Strobe Renderer ─────────────────────────────────────────────────────────

const CX = canvas.width / 2;
const CY = canvas.height / 2;
const OUTER_R = 200;
const INNER_GAP = 52; // clear center for text overlay

// Precompute ring radii
function getRingBounds(i) {
  const totalRings = RINGS.length;
  const available = OUTER_R - INNER_GAP;
  // Distribute from outside in
  let outer = OUTER_R;
  for (let k = 0; k < i; k++) outer -= RINGS[k].width + 2;
  const inner = outer - RINGS[i].width;
  return { outer, inner };
}

function drawStrobe(centsDeviation, hasSignal) {
  ctx2d.clearRect(0, 0, canvas.width, canvas.height);

  // Background circle
  ctx2d.beginPath();
  ctx2d.arc(CX, CY, OUTER_R, 0, Math.PI * 2);
  ctx2d.fillStyle = '#0d0d0d';
  ctx2d.fill();

  if (!hasSignal) {
    // Draw dim static rings
    for (let i = 0; i < RINGS.length; i++) {
      const { outer, inner } = getRingBounds(i);
      const ring = RINGS[i];
      const segAngle = (Math.PI * 2) / ring.segments;
      for (let s = 0; s < ring.segments; s++) {
        const startA = s * segAngle;
        const endA = startA + segAngle * 0.5;
        ctx2d.beginPath();
        ctx2d.arc(CX, CY, outer, startA, endA);
        ctx2d.arc(CX, CY, inner, endA, startA, true);
        ctx2d.closePath();
        ctx2d.fillStyle = '#1c1c1c';
        ctx2d.fill();
      }
    }
    return;
  }

  for (let i = 0; i < RINGS.length; i++) {
    const { outer, inner } = getRingBounds(i);
    const ring = RINGS[i];
    const angle = ringAngles[i];
    const segAngle = (Math.PI * 2) / ring.segments;

    for (let s = 0; s < ring.segments; s++) {
      const startA = s * segAngle + angle;
      const endA = startA + segAngle * 0.5;

      // Alternate bright/dark segments
      const bright = s % 2 === 0;
      if (!bright) continue;

      ctx2d.beginPath();
      ctx2d.arc(CX, CY, outer, startA, endA);
      ctx2d.arc(CX, CY, inner, endA, startA, true);
      ctx2d.closePath();

      // Color: warm amber/cream, brighter when near in-tune
      const proximity = Math.max(0, 1 - Math.abs(centsDeviation) / 25);
      const base = 180 + Math.round(proximity * 50);
      ctx2d.fillStyle = `rgb(${base}, ${Math.round(base * 0.9)}, ${Math.round(base * 0.7)})`;
      ctx2d.fill();
    }
  }

  // Subtle center glow when in tune
  if (Math.abs(centsDeviation) < 2) {
    const alpha = Math.max(0, (2 - Math.abs(centsDeviation)) / 2) * 0.15;
    const grad = ctx2d.createRadialGradient(CX, CY, 0, CX, CY, INNER_GAP + 20);
    grad.addColorStop(0, `rgba(107,224,138,${alpha})`);
    grad.addColorStop(1, 'rgba(107,224,138,0)');
    ctx2d.beginPath();
    ctx2d.arc(CX, CY, INNER_GAP + 20, 0, Math.PI * 2);
    ctx2d.fillStyle = grad;
    ctx2d.fill();
  }

  // Outer ring border
  ctx2d.beginPath();
  ctx2d.arc(CX, CY, OUTER_R, 0, Math.PI * 2);
  ctx2d.strokeStyle = '#222';
  ctx2d.lineWidth = 1.5;
  ctx2d.stroke();
}

// ─── Animation Loop ──────────────────────────────────────────────────────────

// centsPerSecond → radians per second for each ring
// The visual locking speed: at 1 cent deviation, outer ring completes ~1 rev/sec
// Scale factor chosen so the display reads intuitively
const BASE_ROTATION_RATE = (Math.PI * 2) / 100; // radians per cent per second

function animate(timestamp) {
  if (!running) return;
  rafId = requestAnimationFrame(animate);

  const dt = lastFrameTime === null ? 0 : (timestamp - lastFrameTime) / 1000;
  lastFrameTime = timestamp;

  // Pull audio data
  analyser.getFloatTimeDomainData(buffer);
  const amplitude = rms(buffer);

  let displayCents = smoothedCents;
  let currentNote = lastNote;
  let currentFreq = lastFreq;

  if (amplitude > AMPLITUDE_GATE) {
    const { freq, confidence } = yin(buffer, audioCtx.sampleRate);

    if (confidence > 0.5 && freq > 50 && freq < 1400) {
      const { noteName, cents } = freqToNoteAndCents(freq);

      // EMA smoothing on cents
      if (lastCents === null) {
        smoothedCents = cents;
      } else {
        smoothedCents = SMOOTHING_ALPHA * cents + (1 - SMOOTHING_ALPHA) * smoothedCents;
      }
      lastCents = cents;
      lastNote = noteName;
      lastFreq = freq;
      currentNote = noteName;
      currentFreq = freq;
      displayCents = smoothedCents;
      signalPresent = true;
      holdTimer = 1.5; // hold display for 1.5s after signal drops
    }
  } else {
    holdTimer -= dt;
    if (holdTimer <= 0) {
      signalPresent = false;
      lastCents = null;
    }
  }

  // Update ring angles
  for (let i = 0; i < RINGS.length; i++) {
    if (signalPresent || holdTimer > 0) {
      // Rotation rate proportional to cents × harmonic multiplier
      const rate = displayCents * BASE_ROTATION_RATE * RINGS[i].speedMul;
      ringAngles[i] += rate * dt;
    }
  }

  drawStrobe(displayCents, signalPresent || holdTimer > 0);

  // Update DOM
  const hasDisplay = signalPresent || holdTimer > 0;

  if (hasDisplay && currentNote) {
    noteEl.textContent = currentNote;
    noteEl.classList.remove('dim');

    const absCents = Math.abs(displayCents);
    const inTune = absCents < CENTS_IN_TUNE;
    const centsStr = (displayCents >= 0 ? '+' : '') + displayCents.toFixed(1) + '¢';

    centsEl.textContent = centsStr;
    centsEl.classList.remove('dim', 'in-tune');
    if (inTune) centsEl.classList.add('in-tune');

    freqEl.textContent = currentFreq ? currentFreq.toFixed(1) + ' Hz' : '— Hz';
    freqEl.classList.add('active');

    sigIndicator.classList.add('active');

    // Tune needle: map -50 to +50 cents → 0% to 100%
    const pct = Math.max(0, Math.min(100, 50 + displayCents));
    tuneNeedle.style.left = pct + '%';
    tuneNeedle.classList.toggle('in-tune', inTune);
  } else {
    noteEl.textContent = '—';
    noteEl.classList.add('dim');
    centsEl.textContent = '—';
    centsEl.classList.add('dim');
    centsEl.classList.remove('in-tune');
    freqEl.textContent = '— Hz';
    freqEl.classList.remove('active');
    sigIndicator.classList.remove('active');
    tuneNeedle.style.left = '50%';
    tuneNeedle.classList.remove('in-tune');
  }
}

// ─── Audio Setup ─────────────────────────────────────────────────────────────

async function populateDevices() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const inputs = devices.filter(d => d.kind === 'audioinput');
    deviceSel.innerHTML = '';
    inputs.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || `Input ${d.deviceId.slice(0, 6)}`;
      deviceSel.appendChild(opt);
    });
  } catch (e) {
    console.warn('Device enumeration failed', e);
  }
}

async function startAudio() {
  try {
    const deviceId = deviceSel.value;
    const constraints = {
      audio: {
        deviceId: deviceId ? { exact: deviceId } : undefined,
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        latency: 0,
      }
    };

    const stream = await navigator.mediaDevices.getUserMedia(constraints);

    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = BUFFER_SIZE * 2;
    analyser.smoothingTimeConstant = 0;

    sourceNode = audioCtx.createMediaStreamSource(stream);
    sourceNode.connect(analyser);

    buffer = new Float32Array(BUFFER_SIZE);

    await populateDevices();

    running = true;
    lastFrameTime = null;
    startBtn.style.display = 'none';
    statusText.textContent = 'LISTENING';
    rafId = requestAnimationFrame(animate);

  } catch (e) {
    statusText.textContent = 'MIC ACCESS DENIED';
    console.error(e);
  }
}

// ─── Device change ───────────────────────────────────────────────────────────

deviceSel.addEventListener('change', async () => {
  if (!running) return;
  running = false;
  cancelAnimationFrame(rafId);
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  await startAudio();
});

// ─── Init ────────────────────────────────────────────────────────────────────

startBtn.addEventListener('click', startAudio);

// Draw idle state
drawStrobe(0, false);
</script>
</body>
</html>
